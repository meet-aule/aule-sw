# Aule's server, next to a LiveKit server you already run: the platform
# and its worker, their database, a local embedding model, the voice tutor,
# the playground and the team's console. Settings come from one env file (see
# .env.example):
#
#   AULE_ENV_FILE=/etc/aule/aule.env docker compose up -d --build
#   docker compose exec embeddings ollama pull bge-m3      # once
#
# These are read from the shell (or a file given with --env-file), not from
# the env file above:
#
#   AULE_DB_PORT, AULE_EMBEDDINGS_PORT   loopback ports, if 5433 or 11435 are taken
#   AULE_FCM_KEY_FILE                         the Firebase service account key, for pushes
#   AULE_UID, AULE_GID                   who the platform runs as, to read that key
#   AULE_COMMIT                          the commit the images are built from, which they
#                                        report (RELEASING.md); "unknown" if left out
#   AULE_ADMIN_HOST                      where the team's console listens: loopback when
#                                        left out; the server sets 0.0.0.0 for its Worker
#   AULE_ADMIN_ENV_FILE                  the console's own env file, which no other service
#                                        reads: its Worker's secret (ADMIN_EDGE_SECRET)
#   AULE_BILLING_ENV_FILE                payment credentials, read only by platform and worker
#
# The services of this repository use the host network (Linux) and listen on
# loopback only: put your reverse proxy in front of the playground and the
# console. The database and the embedding model are published on loopback ports.
x-service: &service
  env_file:
    - ${AULE_ENV_FILE:-.env}
  network_mode: host
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# The platform and its worker read the Firebase key for push notifications
# from AULE_FCM_KEY_FILE on this machine, and run as AULE_UID so they
# can read it when it belongs to the account that runs the server.
x-platform: &platform
  env_file:
    - ${AULE_ENV_FILE:-.env}
    - ${AULE_BILLING_ENV_FILE:-/dev/null}
  user: "${AULE_UID:-10001}:${AULE_GID:-10001}"
  volumes:
    - ${AULE_FCM_KEY_FILE:-/dev/null}:/run/secrets/firebase.json:ro

services:
  agent:
    <<: *service
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
      args:
        AULE_COMMIT: ${AULE_COMMIT:-unknown}
    # Each session in progress is its own process: about 110 MB on top of
    # roughly 900 MB for the idle worker, so 2g holds eight to ten sessions.
    mem_limit: ${AULE_AGENT_MEMORY:-2g}
    # The voice comes first: when the CPU is short, the agent gets twice the
    # share of a service at the default (1024), and what can wait gets less.
    cpu_shares: 2048

  postgres:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    env_file:
      - ${AULE_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${AULE_DB_PORT:-5433}:5432"
    volumes:
      - aule-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Embeddings for the children's memories, computed on this machine.
  embeddings:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    ports:
      - "127.0.0.1:${AULE_EMBEDDINGS_PORT:-11435}:11434"
    volumes:
      - aule-models:/root/.ollama
    restart: unless-stopped
    mem_limit: 3g
    # A memory's embedding can wait a second; a child's voice cannot.
    cpu_shares: 256

  platform:
    <<: [*platform, *service]
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
      args:
        AULE_COMMIT: ${AULE_COMMIT:-unknown}
    # One image for the API and the worker, so they are never out of step.
    image: aule-platform
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  worker:
    <<: [*platform, *service]
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
      args:
        AULE_COMMIT: ${AULE_COMMIT:-unknown}
    # One image for the API and the worker, so they are never out of step.
    image: aule-platform
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    # Reviews, mail and housekeeping: background work.
    cpu_shares: 512

  playground:
    <<: *service
    build:
      context: .
      dockerfile: apps/playground/Dockerfile
      args:
        AULE_COMMIT: ${AULE_COMMIT:-unknown}
    mem_limit: 256m
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO /dev/null "http://127.0.0.1:$${PLAYGROUND_PORT:-8090}$${PLAYGROUND_BASE_PATH-/playground}/healthz"
      interval: 30s
      timeout: 5s
      retries: 3

  # The team's console (apps/admin), at admin.meetaule.com through its Worker. It keeps no tutoring
  # state, so it can be rebuilt at any time on its own; a restart signs the team out.
  admin:
    <<: *service
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        AULE_COMMIT: ${AULE_COMMIT:-unknown}
    env_file:
      - ${AULE_ENV_FILE:-.env}
      # Only the console reads it: the secret its Worker adds. Empty when left out.
      - ${AULE_ADMIN_ENV_FILE:-/dev/null}
    environment:
      # Loopback unless the server's wrapper says otherwise (infra/server/aule-compose.sh).
      ADMIN_HOST: ${AULE_ADMIN_HOST:-127.0.0.1}
    mem_limit: 128m
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO /dev/null "http://127.0.0.1:$${ADMIN_PORT:-8092}/healthz"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  aule-db:
  aule-models:
