[workspace]
resolver = "2"
members = ["crates/aule-core", "crates/contenido"]

[workspace.package]
edition = "2021"
version = "0.0.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
