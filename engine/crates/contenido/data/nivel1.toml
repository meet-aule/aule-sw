# ───────────────────────── Etapa 1 ─────────────────────────

[etapa1]

[[etapa1.teoria]]
texto = "Imagina que tienes una barra de chocolate y la quieres compartir con un amigo de forma justa. La partes en 2 partes iguales: cada uno recibe lo mismo. Eso es dividir un todo en partes iguales. Si las partes no son iguales, no es justo... y no sirve para hacer fracciones."
grafico = { tipo = "barra", partes = 2, sombreadas = 1 }

[[etapa1.teoria]]
texto = "Cada parte igual tiene un nombre según en cuántas partes partiste el todo. En 2 partes son medios, en 3 son tercios, en 4 son cuartos, en 5 quintos. Esta pizza está partida en 4 partes iguales: cada parte es un cuarto, y se escribe 1/4."
grafico = { tipo = "circulo", partes = 4, sombreadas = 1 }

[[etapa1.teoria]]
texto = "Una fracción tiene dos números. El de abajo es el denominador: dice en cuántas partes iguales se partió el todo. El de arriba es el numerador: dice cuántas de esas partes tomas o pintas. Aquí hay 5 partes iguales y 3 están pintadas: es 3/5, se lee tres quintos."
grafico = { tipo = "barra", partes = 5, sombreadas = 3 }

[[etapa1.teoria]]
texto = "Así se leen: 1/2 un medio, 2/3 dos tercios, 3/4 tres cuartos, 2/5 dos quintos, 5/6 cinco sextos, 4/7 cuatro séptimos, 7/8 siete octavos, 2/9 dos novenos, 3/10 tres décimos. Desde el 11 se agrega «avos»: 5/12 se lee cinco doceavos. Esta barra muestra 3/10."
grafico = { tipo = "barra", partes = 10, sombreadas = 3 }

[[etapa1.teoria]]
texto = "Una fracción también puede ser parte de un conjunto. Hay 6 pelotas y 2 están marcadas. El total de pelotas (6) va abajo y las marcadas (2) van arriba: 2/6 de las pelotas están marcadas."
grafico = { tipo = "conjunto", total = 6, marcados = 2, icono = "⚽" }

[[etapa1.no_asistidos]]
enunciado = "Veamos juntos: ¿qué fracción de la barra está pintada?"
grafico = { tipo = "barra", partes = 6, sombreadas = 5 }
pasos = ["Cuento todas las partes iguales de la barra: son 6. Ese es el denominador, va abajo.", "Cuento solo las partes pintadas: son 5. Ese es el numerador, va arriba.", "La fracción pintada es 5/6. Se lee cinco sextos."]
respuesta = "5/6"
verificar = "5/6"

[[etapa1.no_asistidos]]
enunciado = "Otro ejemplo: en un estuche hay 8 lápices y 3 son azules. ¿Qué fracción de los lápices son azules?"
grafico = { tipo = "conjunto", total = 8, marcados = 3, icono = "✏️" }
pasos = ["El todo es el estuche completo: 8 lápices. El denominador es 8.", "Los que me preguntan son los azules: 3. El numerador es 3.", "Entonces 3/8 de los lápices son azules. Se lee tres octavos."]
respuesta = "3/8"
verificar = "3/8"

[[etapa1.asistidos]]
enunciado = "Ahora tú: ¿qué fracción del círculo está pintada?"
grafico = { tipo = "circulo", partes = 5, sombreadas = 2 }
secuencia = ["Contar todas las partes", "Contar las partes pintadas", "Formar la fracción"]
respuesta = "2/5"
verificar = "2/5"
[[etapa1.asistidos.pasos]]
indicacion = "Paso 1: ¿en cuántas partes iguales está dividido el círculo?"
respuesta = "5"
ayuda = "¿Contaste todos los pedazos, los pintados y los blancos?"
solucion = "El círculo tiene 5 partes iguales en total."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 2: ¿cuántas partes están pintadas?"
respuesta = "2"
ayuda = "¿Cuántos pedazos tienen color?"
solucion = "Hay 2 partes pintadas."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 3: dime la fracción pintada. Recuerda: el total va abajo y las pintadas arriba."
respuesta = "2/5"
ayuda = "¿Qué número va arriba: el de las pintadas o el del total?"
solucion = "Pintadas arriba (2) y total abajo (5): 2/5."

[[etapa1.asistidos]]
enunciado = "Ahora tú: en una bolsa hay 9 caramelos y 4 son de fresa. ¿Qué fracción de los caramelos es de fresa?"
grafico = { tipo = "conjunto", total = 9, marcados = 4, icono = "🍬" }
secuencia = ["Contar el total", "Contar los que te piden", "Formar la fracción"]
respuesta = "4/9"
verificar = "4/9"
[[etapa1.asistidos.pasos]]
indicacion = "Paso 1: ¿cuántos caramelos hay en total en la bolsa?"
respuesta = "9"
ayuda = "¿Cuántos caramelos hay si cuentas todos, de cualquier sabor?"
solucion = "En total hay 9 caramelos."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 2: ¿cuántos caramelos son de fresa?"
respuesta = "4"
ayuda = "¿Qué número dice el problema para los de fresa?"
solucion = "Son 4 caramelos de fresa."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 3: dime la fracción de caramelos de fresa."
respuesta = "4/9"
ayuda = "¿Cuál es el total, que va abajo, y cuántos son de fresa, que van arriba?"
solucion = "Fresa arriba (4) y total abajo (9): 4/9."

[etapa1.explicar]
pregunta = "Con tus propias palabras: en una fracción como 3/4, ¿qué significa el número de abajo y qué significa el número de arriba?"
criterio = "Explica que el denominador (abajo) dice en cuántas partes iguales se dividió el todo y que el numerador (arriba) dice cuántas de esas partes se toman o se pintan."
claves = [["abajo", "denominador"], ["partes iguales", "total", "divid", "partid", "en cuantas"], ["arriba", "numerador"], ["pint", "toma", "coge", "agarr", "comi", "se usan"]]
minimo_claves = 3
pistas = ["Si partes una pizza en 4 partes iguales, ¿qué número te dice en cuántas partes la partiste?", "Si te comes 3 de esas partes, ¿dónde va ese 3: arriba o abajo?"]
pista_grafica = { texto = "Mira: la pizza tiene 4 partes iguales y 3 están pintadas.", grafico = { tipo = "circulo", partes = 4, sombreadas = 3 } }

[[etapa1.repaso]]
texto = "Vamos despacio. Primero, un todo (una pizza, una barra) se parte en partes iguales. Cuenta todas las partes: aquí hay 4. Ese número va abajo, es el denominador."
grafico = { tipo = "barra", partes = 4, sombreadas = 3 }

[[etapa1.repaso]]
texto = "Ahora cuenta solo las partes pintadas: hay 3. Ese número va arriba, es el numerador. La fracción es 3/4: tres cuartos."
grafico = { tipo = "barra", partes = 4, sombreadas = 3 }

[[etapa1.repaso]]
texto = "Un truco para recordar: abajo va el total de partes iguales; arriba van las partes que tomas. Abajo, todas. Arriba, las que tomas."

