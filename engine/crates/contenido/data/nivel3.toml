criterio_explicacion = "Suma los numeradores dejando el denominador (9/6) y explica que 6/6 forman un entero y sobran 3/6, por eso es 1 3/6 (o 1 1/2 si simplifica)."
claves_explicacion = [["numerador", "arriba", "9/6"], ["entero", "6/6", "sobra", "queda"], ["mismo denominador", "se queda", "se mantiene", "no cambia"]]
