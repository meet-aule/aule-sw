# ---------------------------------------------------------------- Etapa 1

[etapa1]

[[etapa1.teoria]]
texto = "Ya sabes reconocer fracciones equivalentes, simplificar y comparar. Ahora vamos a juntar y quitar fracciones. Mira 2/5 y 1/5: las dos son quintos. Sus pedazos son del mismo tamaño."
grafico = { tipo = "barras", filas = [{ partes = 5, sombreadas = 2, etiqueta = "2/5" }, { partes = 5, sombreadas = 1, etiqueta = "1/5" }] }

[[etapa1.teoria]]
texto = "Para sumar, juntas los pedazos: sumas los numeradores y el denominador se queda igual. 2/5 + 1/5 = 3/5. ¡Ojo! Los denominadores no se suman: al juntar, los pedazos no cambian de tamaño."
grafico = { tipo = "barra", partes = 5, sombreadas = 3, etiqueta = "2/5 + 1/5 = 3/5" }

[[etapa1.teoria]]
texto = "Para restar, quitas pedazos. Tenías 5/8 y quitas 2/8: te quedan 3/8. Restas los numeradores y el denominador se queda igual. Si puedes, simplifica al final, como ya sabes hacer."
grafico = { tipo = "barras", filas = [{ partes = 8, sombreadas = 5, etiqueta = "tenías 5/8" }, { partes = 8, sombreadas = 3, etiqueta = "te quedan 3/8" }] }

[[etapa1.teoria]]
texto = "A veces el numerador es mayor que el denominador, como en 7/4. Es una fracción impropia: vale más de un entero. Con 4/4 formas 1 entero y te sobran 3/4. Entonces 7/4 = 1 3/4. A eso le llamamos número mixto: un entero y una fracción."
grafico = { tipo = "circulos", partes = 4, sombreadas = 7 }

[[etapa1.teoria]]
texto = "También puedes ir al revés. Para pasar 2 1/3 a impropia: cada entero tiene 3 tercios, así que 2 enteros son 2 × 3 = 6 tercios. Le sumas el tercio que sobra: 6 + 1 = 7. Entonces 2 1/3 = 7/3."
grafico = { tipo = "circulos", partes = 3, sombreadas = 7 }

[[etapa1.no_asistidos]]
enunciado = "Calculemos 7/9 - 4/9 y simplifiquemos el resultado."
grafico = { tipo = "barras", filas = [{ partes = 9, sombreadas = 7, etiqueta = "7/9" }, { partes = 9, sombreadas = 4, etiqueta = "quito 4/9" }] }
pasos = ["Miro los denominadores: los dos son 9, son novenos.", "Resto los numeradores: 7 - 4 = 3.", "Dejo el denominador: 3/9.", "Simplifico: 3 y 9 se pueden dividir entre 3. Me queda 1/3."]
respuesta = "1/3"
verificar = "7/9 - 4/9"

[[etapa1.no_asistidos]]
enunciado = "Pasemos 11/4 a número mixto."
grafico = { tipo = "circulos", partes = 4, sombreadas = 11 }
pasos = ["Cada entero tiene 4 cuartos. ¿Cuántas veces cabe 4 en 11? Cabe 2 veces, porque 2 × 4 = 8.", "Con 8 cuartos formo 2 enteros. Me sobran 11 - 8 = 3 cuartos.", "Junto el entero y lo que sobra: 11/4 = 2 3/4."]
respuesta = "2 3/4"
verificar = "11/4"

[[etapa1.asistidos]]
enunciado = "Ahora tú: 4/9 + 2/9."
secuencia = ["Mirar los denominadores", "Sumar los numeradores", "Dar el resultado"]
respuesta = "6/9"
verificar = "4/9 + 2/9"
[[etapa1.asistidos.pasos]]
indicacion = "Paso 1: ¿los denominadores son iguales? Responde sí o no."
respuesta = "Sí"
opciones = ["Sí", "No"]
ayuda = "¿Qué número hay abajo en cada fracción?"
solucion = "Los dos tienen 9 abajo, así que sí son iguales."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 2: suma los numeradores. ¿Cuánto es 4 + 2?"
respuesta = "6"
ayuda = "¿Cuánto tienes si juntas 4 y 2?"
solucion = "4 + 2 = 6."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 3: dime el resultado como fracción."
respuesta = "6/9"
ayuda = "¿Qué numerador te salió y qué denominador se queda?"
solucion = "El numerador es 6 y el denominador sigue siendo 9: el resultado es 6/9."

[[etapa1.asistidos]]
enunciado = "Ahora tú: convierte 2 3/5 en fracción impropia."
grafico = { tipo = "circulos", partes = 5, sombreadas = 13 }
secuencia = ["Multiplicar el entero por el denominador", "Sumar el numerador", "Dar la fracción impropia"]
respuesta = "13/5"
verificar = "2 + 3/5"
[[etapa1.asistidos.pasos]]
indicacion = "Paso 1: cada entero tiene 5 quintos. ¿Cuántos quintos hay en 2 enteros? Calcula 2 × 5."
respuesta = "10"
ayuda = "Si cada círculo tiene 5 pedazos, ¿cuántos pedazos hay en 2 círculos?"
solucion = "2 × 5 = 10. En 2 enteros hay 10 quintos."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 2: suma los 3 quintos que sobran. ¿Cuánto es 10 + 3?"
respuesta = "13"
ayuda = "¿Cuántos quintos tienes si a los de los enteros les agregas los que sobran?"
solucion = "10 + 3 = 13 quintos."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 3: dime la fracción impropia."
respuesta = "13/5"
ayuda = "¿Cuántos quintos tienes en total? Ese va arriba. ¿Y qué va abajo?"
solucion = "Son 13 quintos: 2 3/5 = 13/5."

[etapa1.explicar]
pregunta = "Con tus propias palabras: ¿cómo se suman dos fracciones que tienen el mismo denominador? ¿Por qué el denominador no cambia?"
criterio = "Explica que se suman los numeradores y el denominador queda igual porque las partes son del mismo tamaño (solo cambia cuántas hay)."
claves = [["numerador", "arriba"], ["denominador", "abajo"], ["igual", "mismo", "se queda", "no cambia", "se mantiene", "tamaño"]]
minimo_claves = 2
pistas = ["Si tienes 2 pedazos de pizza de octavos y te dan 3 pedazos más de octavos, ¿cuántos pedazos tienes?", "¿Esos pedazos cambiaron de tamaño al juntarlos?"]
pista_grafica = { texto = "Mira: 2/8 y 3/8 juntos.", grafico = { tipo = "barras", filas = [{ partes = 8, sombreadas = 2, etiqueta = "2/8" }, { partes = 8, sombreadas = 3, etiqueta = "3/8" }, { partes = 8, sombreadas = 5, etiqueta = "juntos" }] } }

[[etapa1.repaso]]
texto = "Repasemos con calma. El denominador dice el tamaño de cada pedazo: en octavos, el todo está partido en 8 partes iguales. El numerador dice cuántos pedazos tienes."
grafico = { tipo = "barra", partes = 8, sombreadas = 3, etiqueta = "3/8" }

[[etapa1.repaso]]
texto = "Si juntas 3 octavos y 2 octavos, tienes 5 pedazos, y siguen siendo octavos: 3/8 + 2/8 = 5/8. El tamaño de los pedazos no cambia, por eso el denominador se queda igual."
grafico = { tipo = "barras", filas = [{ partes = 8, sombreadas = 3, etiqueta = "3/8" }, { partes = 8, sombreadas = 2, etiqueta = "2/8" }, { partes = 8, sombreadas = 5, etiqueta = "5/8" }] }

[[etapa1.repaso]]
texto = "Si sumaras también los denominadores, te saldría 5/16: pedazos más chiquitos. ¡No tiene sentido! Juntaste más pizza, no menos."
grafico = { tipo = "barras", filas = [{ partes = 8, sombreadas = 5, etiqueta = "5/8" }, { partes = 16, sombreadas = 5, etiqueta = "5/16" }] }

