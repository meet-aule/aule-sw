# ───────────────────────── Etapa 1 ─────────────────────────

[etapa1]

[[etapa1.teoria]]
texto = "Ya sabes leer y dibujar fracciones. Ahora mira algo curioso: estas tres barras son del mismo largo. Una tiene pintado 1/2, otra 2/4 y otra 4/8. ¡Lo pintado mide lo mismo! Cuando dos fracciones muestran la misma cantidad, se llaman fracciones equivalentes."
grafico = { tipo = "barras", filas = [{ partes = 2, sombreadas = 1, etiqueta = "1/2" }, { partes = 4, sombreadas = 2, etiqueta = "2/4" }, { partes = 8, sombreadas = 4, etiqueta = "4/8" }] }

[[etapa1.teoria]]
texto = "Para conseguir una fracción equivalente, multiplica el numerador y el denominador por el mismo número. Por ejemplo, 2/3 por 2 arriba y abajo da 4/6. Es como partir cada pedazo en 2: hay el doble de partes y el doble de partes pintadas, pero lo pintado no cambia."
grafico = { tipo = "barras", filas = [{ partes = 3, sombreadas = 2, etiqueta = "2/3" }, { partes = 6, sombreadas = 4, etiqueta = "4/6" }] }

[[etapa1.teoria]]
texto = "Simplificar es el camino de regreso: divide el numerador y el denominador entre el mismo número. Por ejemplo, 6/9 entre 3 arriba y abajo da 2/3. Una fracción está simplificada cuando ningún número, aparte del 1, divide a la vez al numerador y al denominador."
grafico = { tipo = "barras", filas = [{ partes = 9, sombreadas = 6, etiqueta = "6/9" }, { partes = 3, sombreadas = 2, etiqueta = "2/3" }] }

[[etapa1.teoria]]
texto = "Para comparar: si tienen el mismo denominador, las partes son del mismo tamaño y gana la que tiene más partes: 5/8 > 3/8. Si tienen el mismo numerador, gana la de partes más grandes, o sea, la de denominador más chico: 3/4 > 3/5. Recuerda: > es «mayor que» y < es «menor que»; la abertura mira a la fracción mayor."
grafico = { tipo = "barras", filas = [{ partes = 8, sombreadas = 5, etiqueta = "5/8" }, { partes = 8, sombreadas = 3, etiqueta = "3/8" }] }

[[etapa1.teoria]]
texto = "Si los denominadores son distintos, busca fracciones equivalentes con el mismo denominador. Para 2/3 y 3/4 usamos doceavos: 2/3 = 8/12 y 3/4 = 9/12. Como 9/12 > 8/12, entonces 3/4 > 2/3."
grafico = { tipo = "barras", filas = [{ partes = 12, sombreadas = 8, etiqueta = "2/3 = 8/12" }, { partes = 12, sombreadas = 9, etiqueta = "3/4 = 9/12" }] }

[[etapa1.no_asistidos]]
enunciado = "Veamos juntos: simplifiquemos 8/12."
grafico = { tipo = "barras", filas = [{ partes = 12, sombreadas = 8, etiqueta = "8/12" }, { partes = 3, sombreadas = 2, etiqueta = "2/3" }] }
pasos = ["Busco un número que divida a 8 y a 12 a la vez: el 2 y el 4 sirven. Uso el 4, que es el más grande.", "Divido arriba: 8 ÷ 4 = 2. Divido abajo: 12 ÷ 4 = 3.", "Me queda 2/3. ¿Se puede seguir? 2 y 3 solo se dividen juntos entre 1, así que 8/12 simplificada es 2/3."]
respuesta = "2/3"
verificar = "8/12"

[[etapa1.no_asistidos]]
enunciado = "Otro ejemplo: ¿qué fracción es mayor, 3/5 o 1/2?"
grafico = { tipo = "barras", filas = [{ partes = 10, sombreadas = 6, etiqueta = "3/5 = 6/10" }, { partes = 10, sombreadas = 5, etiqueta = "1/2 = 5/10" }] }
pasos = ["Los denominadores son distintos (5 y 2). Busco uno común: el 10.", "3/5 = 6/10 (por 2 arriba y abajo) y 1/2 = 5/10 (por 5 arriba y abajo).", "Ahora las partes son del mismo tamaño: 6/10 > 5/10. Entonces la mayor es 3/5."]
respuesta = "3/5"
verificar = "3/5"

[[etapa1.asistidos]]
enunciado = "Ahora tú: completa la fracción equivalente 3/4 = ?/20."
secuencia = ["Ver por cuánto se multiplicó el denominador", "Multiplicar el numerador por lo mismo", "Formar la fracción"]
respuesta = "15/20"
verificar = "3/4"
[[etapa1.asistidos.pasos]]
indicacion = "Paso 1: el denominador pasó de 4 a 20. ¿Por qué número se multiplicó? (4 × ? = 20)"
respuesta = "5"
ayuda = "¿Qué número de la tabla del 4 da 20?"
solucion = "4 × 5 = 20, así que se multiplicó por 5."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 2: multiplica el numerador por el mismo número. ¿Cuánto es 3 × 5?"
respuesta = "15"
ayuda = "¿Cuánto suman cinco veces 3?"
solucion = "3 × 5 = 15."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 3: dime la fracción equivalente con denominador 20."
respuesta = "15/20"
ayuda = "¿Qué numerador te salió en el paso 2?"
solucion = "La fracción equivalente es 15/20."

[[etapa1.asistidos]]
enunciado = "Ahora tú: ¿qué fracción es mayor, 2/3 o 5/6?"
grafico = { tipo = "barras", filas = [{ partes = 3, sombreadas = 2, etiqueta = "2/3" }, { partes = 6, sombreadas = 5, etiqueta = "5/6" }] }
secuencia = ["Buscar un denominador común", "Convertir la fracción", "Comparar los numeradores"]
respuesta = "5/6"
verificar = "5/6"
[[etapa1.asistidos.pasos]]
indicacion = "Paso 1: queremos que 2/3 tenga denominador 6. ¿Por qué número multiplicas el 3 para llegar a 6?"
respuesta = "2"
ayuda = "¿3 por cuánto da 6?"
solucion = "3 × 2 = 6, así que multiplicamos por 2."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 2: dime 2/3 con denominador 6."
respuesta = "4/6"
ayuda = "Si multiplicas abajo por 2, ¿qué haces con el 2 de arriba?"
solucion = "2 × 2 = 4 y 3 × 2 = 6: 2/3 = 4/6."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 3: ahora compara 4/6 y 5/6. ¿Cuál de las fracciones originales es mayor?"
respuesta = "5/6"
opciones = ["2/3", "5/6"]
ayuda = "Si las partes son del mismo tamaño, ¿cuál tiene más partes: 4/6 o 5/6?"
solucion = "5/6 > 4/6, y 4/6 es lo mismo que 2/3. La mayor es 5/6."

[etapa1.explicar]
pregunta = "Con tus propias palabras: ¿por qué 2/3 y 4/6 son fracciones equivalentes?"
criterio = "Explica que representan la misma cantidad del todo y que 4/6 se obtiene multiplicando el numerador y el denominador de 2/3 por el mismo número (2), o que 4/6 se simplifica a 2/3 dividiendo entre 2."
claves = [["misma cantidad", "lo mismo", "igual", "mismo tamano", "misma parte"], ["multiplic", "por 2", "doble", "divid", "entre 2", "mitad"], ["numerador y denominador", "arriba y abajo", "los dos", "ambos"]]
minimo_claves = 2
pistas = ["Si pintas 2/3 de una barra y 4/6 de otra barra igual, ¿cuál tiene más pintado?", "¿Por qué número multiplicas el 2 y el 3 para llegar a 4 y 6?"]
pista_grafica = { texto = "Compara: dos barras del mismo largo, 2/3 arriba y 4/6 abajo.", grafico = { tipo = "barras", filas = [{ partes = 3, sombreadas = 2, etiqueta = "2/3" }, { partes = 6, sombreadas = 4, etiqueta = "4/6" }] } }

[[etapa1.repaso]]
texto = "Vamos despacio. Mira estas dos barras del mismo largo: arriba está pintado 2/3 y abajo 4/6. Lo pintado llega exactamente hasta el mismo lugar. Por eso son equivalentes: es la misma cantidad."
grafico = { tipo = "barras", filas = [{ partes = 3, sombreadas = 2, etiqueta = "2/3" }, { partes = 6, sombreadas = 4, etiqueta = "4/6" }] }

[[etapa1.repaso]]
texto = "En la barra de abajo, cada tercio se partió en 2. Por eso hay el doble de partes (6 en vez de 3) y el doble de pintadas (4 en vez de 2). Es multiplicar arriba y abajo por 2."

[[etapa1.repaso]]
texto = "La regla de oro: si haces lo mismo arriba y abajo (multiplicar o dividir por el mismo número), la cantidad no cambia. Así encuentras equivalentes y así simplificas."

