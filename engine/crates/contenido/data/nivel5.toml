[[etapa1.asistidos]]
enunciado = "Ahora tú: Martín gastó 1/2 de su propina en un cuaderno y 1/5 en un lápiz. ¿Qué parte de su propina le queda?"
grafico = { tipo = "barras", filas = [{ partes = 10, sombreadas = 5, etiqueta = "cuaderno 1/2" }, { partes = 10, sombreadas = 2, etiqueta = "lápiz 1/5" }] }
secuencia = ["Sumar lo gastado", "Expresar el total como fracción", "Restar"]
