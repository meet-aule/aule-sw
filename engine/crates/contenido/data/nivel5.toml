[[etapa1.asistidos.pasos]]
indicacion = "Paso 1: suma lo que gastó, 1/2 + 1/5. ¿Cuánto da?"
respuesta = "7/10"
ayuda = "¿Qué denominador común sirve para medios y quintos? ¿Cuántos décimos son 1/2 y cuántos son 1/5?"
solucion = "1/2 = 5/10 y 1/5 = 2/10. Entonces 5/10 + 2/10 = 7/10."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 2: toda la propina es 1 entero. ¿Cuántos décimos son 1 entero?"
respuesta = "10/10"
ayuda = "Si la propina está partida en 10 partes iguales, ¿cuántas partes tiene toda la propina?"
solucion = "1 entero = 10/10."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 3: resta 10/10 − 7/10. ¿Qué parte le queda?"
respuesta = "3/10"
ayuda = "Si tienes 10 décimos y quitas 7 décimos, ¿cuántos décimos quedan?"
solucion = "10/10 − 7/10 = 3/10. Le queda 3/10 de su propina."

[etapa1.explicar]
pregunta = "Con tus propias palabras: ¿cómo calculas una fracción de una cantidad, por ejemplo 3/4 de 20?"
criterio = "Explica que se reparte (divide) la cantidad entre el denominador para saber cuánto vale cada parte, y luego se multiplica por el numerador porque son las partes que se toman. Puede usar el ejemplo: 20 ÷ 4 = 5 y 3 × 5 = 15."
