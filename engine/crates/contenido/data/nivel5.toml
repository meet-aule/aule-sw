[ejercicios.similar]
enunciado = "Tito leyó 1/4 de un libro y le faltan 45 páginas. ¿Cuántas páginas tiene el libro?"
pasos = ["Si leyó 1/4, le falta 4/4 − 1/4 = 3/4 del libro.", "3/4 son 45 páginas, entonces 1/4 son 45 ÷ 3 = 15 páginas.", "El libro entero: 4 × 15 = 60 páginas."]
respuesta = "60"
verificar = "45 / (1 - 1/4)"

# ---------------------------------------------------------------- Simulación
[[simulacion]]
id = "n5-s1"
enunciado = "Calcula 4/7 de 35."
respuesta = "20"
verificar = "(4/7) * 35"
tiempo_s = 80

[[simulacion]]
id = "n5-s2"
enunciado = "Juan tenía 48 caramelos. Regaló 1/4 a su prima y 1/6 a su amigo. ¿Cuántos caramelos le quedan?"
respuesta = "28"
verificar = "48 - (1/4) * 48 - (1/6) * 48"
tiempo_s = 180

[[simulacion]]
id = "n5-s3"
enunciado = "2/3 de un número es 16. ¿Cuál es el número?"
respuesta = "24"
verificar = "16 / (2/3)"
tiempo_s = 150

[[simulacion]]
id = "n5-s4"
enunciado = "Una cinta mide 1 metro. Se cortó 2/5 de la cinta y luego 1/4 del total. ¿Qué parte de la cinta queda?"
respuesta = "7/20"
verificar = "1 - 2/5 - 1/4"
tiempo_s = 180
