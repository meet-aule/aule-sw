[[etapa1.repaso]]
texto = "Repasemos con calma. En una fracción, el denominador (abajo) te dice en cuántas partes iguales repartes la cantidad. El numerador (arriba) te dice cuántas de esas partes tomas."
grafico = { tipo = "barra", partes = 4, sombreadas = 3, etiqueta = "3/4" }

[[etapa1.repaso]]
texto = "Ejemplo: 3/4 de 12. Reparto 12 en 4 grupos: 12 ÷ 4 = 3 en cada grupo. Tomo 3 grupos: 3 × 3 = 9. Entonces 3/4 de 12 es 9."
grafico = { tipo = "conjunto", total = 12, marcados = 9, icono = "🍎" }

[[etapa1.repaso]]
texto = "Para saber qué parte queda, piensa en el todo como un entero escrito con el mismo denominador: 8/8, 10/10, 12/12… y le restas lo que se usó. Si se usó 3/8, quedan 8/8 − 3/8 = 5/8."
