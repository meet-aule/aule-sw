# ---------------------------------------------------------------- Etapa 1
[etapa1]

[[etapa1.teoria]]
texto = "En el nivel anterior aprendiste a sumar y restar fracciones con distinto denominador. Por ejemplo, 1/3 + 1/4: pasas las dos a doceavos y te da 4/12 + 3/12 = 7/12. Ahora vas a usar todo eso para resolver problemas de la vida real, de varios pasos."
grafico = { tipo = "barras", filas = [{ partes = 3, sombreadas = 1, etiqueta = "1/3" }, { partes = 4, sombreadas = 1, etiqueta = "1/4" }, { partes = 12, sombreadas = 7, etiqueta = "7/12" }] }

[[etapa1.teoria]]
texto = "Primera idea nueva: la fracción de una cantidad. ¿Cuánto es 3/4 de 20? El denominador 4 te dice que repartas 20 en 4 grupos iguales: 20 ÷ 4 = 5 en cada grupo. El numerador 3 te dice que tomes 3 grupos: 3 × 5 = 15. Entonces 3/4 de 20 es 15."
grafico = { tipo = "conjunto", total = 20, marcados = 15, icono = "🍬" }

[[etapa1.teoria]]
texto = "Recuerda el truco: primero divides entre el denominador y después multiplicas por el numerador. Divido, luego multiplico."
grafico = { tipo = "barra", partes = 4, sombreadas = 3, etiqueta = "3/4 de 20 = 15" }

[[etapa1.teoria]]
texto = "Segunda idea: ¿qué parte queda? Si alguien gasta 1/3 y luego 1/4 de su dinero, primero sumas lo que gastó: 1/3 + 1/4 = 7/12. Todo el dinero es 12/12. Entonces le queda 12/12 − 7/12 = 5/12."
grafico = { tipo = "barras", filas = [{ partes = 12, sombreadas = 4, etiqueta = "gastó 1/3 = 4/12" }, { partes = 12, sombreadas = 3, etiqueta = "gastó 1/4 = 3/12" }, { partes = 12, sombreadas = 5, etiqueta = "queda 5/12" }] }

[[etapa1.teoria]]
texto = "Tercera idea: cuánto queda de una cantidad. De 24 figuritas, Diego regala 3/8. Calculo lo que regaló: 24 ÷ 8 = 3 y 3 × 3 = 9. Le quedan 24 − 9 = 15 figuritas. En el dibujo, las resaltadas son las 15 que le quedan."
grafico = { tipo = "conjunto", total = 24, marcados = 15, icono = "🃏" }

