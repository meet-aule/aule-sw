# ---------------------------------------------------------------- Etapa 1

[etapa1]

[[etapa1.teoria]]
texto = "Ya sabes sumar fracciones con el mismo denominador: 2/5 + 1/5 = 3/5. Pero, ¿y si tienes 1/2 + 1/4? Una mitad y un cuarto son pedazos de distinto tamaño. Así no se pueden juntar todavía."
grafico = { tipo = "barras", filas = [{ partes = 2, sombreadas = 1, etiqueta = "1/2" }, { partes = 4, sombreadas = 1, etiqueta = "1/4" }] }

[[etapa1.teoria]]
texto = "El truco es usar fracciones equivalentes, que ya conoces. 1/2 es lo mismo que 2/4. Ahora las dos fracciones son cuartos, y sí se pueden sumar: 2/4 + 1/4 = 3/4."
grafico = { tipo = "barras", filas = [{ partes = 2, sombreadas = 1, etiqueta = "1/2" }, { partes = 4, sombreadas = 2, etiqueta = "2/4" }, { partes = 4, sombreadas = 3, etiqueta = "2/4 + 1/4 = 3/4" }] }

[[etapa1.teoria]]
texto = "¿Cómo encuentras el denominador común? Busca un número que esté en la tabla de los dos denominadores. Para 1/3 + 1/4: la tabla del 3 tiene 3, 6, 9, 12; la del 4 tiene 4, 8, 12. El menor que se repite es 12: es el mcm. Entonces 1/3 = 4/12 y 1/4 = 3/12."
grafico = { tipo = "barras", filas = [{ partes = 3, sombreadas = 1, etiqueta = "1/3" }, { partes = 12, sombreadas = 4, etiqueta = "4/12" }, { partes = 4, sombreadas = 1, etiqueta = "1/4" }, { partes = 12, sombreadas = 3, etiqueta = "3/12" }] }

[[etapa1.teoria]]
texto = "Con el mismo denominador, haces lo del nivel anterior: sumas o restas los numeradores. 1/3 + 1/4 = 4/12 + 3/12 = 7/12. Y para restar: 1/3 - 1/4 = 4/12 - 3/12 = 1/12."
grafico = { tipo = "barra", partes = 12, sombreadas = 7, etiqueta = "4/12 + 3/12 = 7/12" }

[[etapa1.teoria]]
texto = "Al final, mira si puedes simplificar. Por ejemplo, 1/6 + 1/3 = 1/6 + 2/6 = 3/6, y 3/6 es lo mismo que 1/2."
grafico = { tipo = "barras", filas = [{ partes = 6, sombreadas = 3, etiqueta = "3/6" }, { partes = 2, sombreadas = 1, etiqueta = "1/2" }] }

[[etapa1.no_asistidos]]
enunciado = "Calculemos 1/2 + 1/3."
grafico = { tipo = "barras", filas = [{ partes = 2, sombreadas = 1, etiqueta = "1/2" }, { partes = 3, sombreadas = 1, etiqueta = "1/3" }] }
pasos = ["Los denominadores son 2 y 3: son distintos.", "Busco un número que esté en la tabla del 2 y del 3: el menor es 6.", "Convierto: 1/2 = 3/6 (multiplico arriba y abajo por 3) y 1/3 = 2/6 (multiplico arriba y abajo por 2).", "Sumo los numeradores: 3/6 + 2/6 = 5/6.", "5/6 ya no se puede simplificar. El resultado es 5/6."]
respuesta = "5/6"
verificar = "1/2 + 1/3"

[[etapa1.no_asistidos]]
enunciado = "Calculemos 5/6 - 1/3 y simplifiquemos el resultado."
grafico = { tipo = "barras", filas = [{ partes = 6, sombreadas = 5, etiqueta = "5/6" }, { partes = 3, sombreadas = 1, etiqueta = "1/3" }] }
pasos = ["Los denominadores son 6 y 3. El 6 está en la tabla del 3, así que el denominador común es 6.", "Convierto 1/3 en sextos: 1/3 = 2/6. El 5/6 se queda igual.", "Resto los numeradores: 5/6 - 2/6 = 3/6.", "Simplifico: 3 y 6 se dividen entre 3. El resultado es 1/2."]
respuesta = "1/2"
verificar = "5/6 - 1/3"

[[etapa1.asistidos]]
enunciado = "Ahora tú: 1/4 + 3/8."
grafico = { tipo = "barras", filas = [{ partes = 4, sombreadas = 1, etiqueta = "1/4" }, { partes = 8, sombreadas = 3, etiqueta = "3/8" }] }
secuencia = ["Buscar el denominador común", "Convertir en fracciones equivalentes", "Sumar los numeradores"]
respuesta = "5/8"
verificar = "1/4 + 3/8"
[[etapa1.asistidos.pasos]]
indicacion = "Paso 1: ¿cuál es el menor número que está en la tabla del 4 y también en la del 8?"
respuesta = "8"
ayuda = "¿El 8 está en la tabla del 4?"
solucion = "La tabla del 4 tiene 4, 8, 12... y la del 8 empieza en 8. El denominador común es 8."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 2: convierte 1/4 en octavos. Dime la fracción equivalente."
respuesta = "2/8"
ayuda = "¿Por qué número multiplicas el 4 para llegar a 8? Multiplica el numerador por ese mismo número."
solucion = "4 × 2 = 8, así que multiplico arriba y abajo por 2: 1/4 = 2/8."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 3: ahora suma 2/8 + 3/8."
respuesta = "5/8"
ayuda = "Ya son octavos. ¿Qué haces con los numeradores?"
solucion = "2 + 3 = 5 y el denominador se queda en 8: el resultado es 5/8."

[[etapa1.asistidos]]
enunciado = "Ahora tú: 2/3 - 1/2."
grafico = { tipo = "barras", filas = [{ partes = 3, sombreadas = 2, etiqueta = "2/3" }, { partes = 2, sombreadas = 1, etiqueta = "1/2" }] }
secuencia = ["Buscar el denominador común", "Convertir la primera fracción", "Convertir la segunda fracción", "Restar los numeradores"]
respuesta = "1/6"
verificar = "2/3 - 1/2"
[[etapa1.asistidos.pasos]]
indicacion = "Paso 1: ¿cuál es el menor número que está en la tabla del 3 y también en la del 2?"
respuesta = "6"
ayuda = "Piensa en la tabla del 3: 3, 6, 9... ¿Cuál de esos está también en la tabla del 2?"
solucion = "El 3 no está en la tabla del 2, pero el 6 sí. El denominador común es 6."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 2: convierte 2/3 en sextos."
respuesta = "4/6"
ayuda = "¿Por qué número multiplicas el 3 para llegar a 6?"
solucion = "3 × 2 = 6, así que multiplico arriba y abajo por 2: 2/3 = 4/6."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 3: convierte 1/2 en sextos."
respuesta = "3/6"
ayuda = "¿Por qué número multiplicas el 2 para llegar a 6?"
solucion = "2 × 3 = 6, así que multiplico arriba y abajo por 3: 1/2 = 3/6."
[[etapa1.asistidos.pasos]]
indicacion = "Paso 4: resta 4/6 - 3/6."
respuesta = "1/6"
ayuda = "Ya son sextos. ¿Cuánto es 4 - 3?"
solucion = "4 - 3 = 1 y el denominador se queda en 6: el resultado es 1/6."

[etapa1.explicar]
pregunta = "Con tus propias palabras: ¿por qué no puedes sumar 1/2 + 1/3 sumando arriba con arriba y abajo con abajo? ¿Qué haces en su lugar?"
criterio = "Explica que los pedazos son de distinto tamaño (medios y tercios), por eso primero hay que convertirlas en fracciones equivalentes con un mismo denominador (denominador común, por ejemplo 6) y recién sumar los numeradores."
claves = [["distinto", "diferente", "tamaño"], ["equivalente", "convert", "denominador comun", "mismo denominador", "igual denominador", "mcm", "sextos"], ["numerador", "arriba"]]
minimo_claves = 2
pistas = ["¿Un medio y un tercio son pedazos del mismo tamaño?", "¿En qué pedazos más pequeños podrías partir tanto la mitad como el tercio para que todos sean del mismo tamaño?"]
pista_grafica = { texto = "Mira cómo la mitad y el tercio se pueden partir en sextos.", grafico = { tipo = "barras", filas = [{ partes = 2, sombreadas = 1, etiqueta = "1/2" }, { partes = 6, sombreadas = 3, etiqueta = "3/6" }, { partes = 3, sombreadas = 1, etiqueta = "1/3" }, { partes = 6, sombreadas = 2, etiqueta = "2/6" }] } }

[[etapa1.repaso]]
texto = "Repasemos. Solo puedes juntar pedazos del mismo tamaño. 1/2 y 1/4 no lo son: una mitad es más grande que un cuarto."
grafico = { tipo = "barras", filas = [{ partes = 2, sombreadas = 1, etiqueta = "1/2" }, { partes = 4, sombreadas = 1, etiqueta = "1/4" }] }

[[etapa1.repaso]]
texto = "Por eso, primero cambias una fracción por otra equivalente con el mismo denominador. Multiplicas arriba y abajo por el mismo número: 1/2 = (1 × 2)/(2 × 2) = 2/4."
grafico = { tipo = "barras", filas = [{ partes = 2, sombreadas = 1, etiqueta = "1/2" }, { partes = 4, sombreadas = 2, etiqueta = "2/4" }] }

[[etapa1.repaso]]
texto = "Ahora sí son cuartos: 2/4 + 1/4 = 3/4. Recuerda: el denominador común es un número que está en la tabla de los dos denominadores."
grafico = { tipo = "barra", partes = 4, sombreadas = 3, etiqueta = "3/4" }

