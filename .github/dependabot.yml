# Weekly updates, each one at least a week old (cooldown): time for a
# compromised release to be found and pulled before it is proposed here.
version: 2
updates:
  - package-ecosystem: cargo
    commit-message:
      prefix: "chore(platform-deps)"
    directory: /apps/platform
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      platform-compatible:
        update-types: [minor, patch]
  - package-ecosystem: uv
    commit-message:
      prefix: "chore(agent-deps)"
    directory: /apps/agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      agent-compatible:
        update-types: [minor, patch]
  - package-ecosystem: npm
    commit-message:
      prefix: "chore(web-deps)"
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      web-compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    commit-message:
      prefix: "ci(actions)"
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    commit-message:
      prefix: "build(images)"
    directories:
      - /apps/admin
      - /apps/agent
      - /apps/platform
      - /apps/playground
      - /infra/runner
    ignore:
      # Keep runtime updates within the versions exercised by this repository.
      - dependency-name: python
        versions: [">=3.15"]
      - dependency-name: node
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    commit-message:
      prefix: "build(compose)"
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The images the services are built from and run, pinned by digest.
  - package-ecosystem: docker
    commit-message:
      prefix: "chore(images)"
    directories: [/apps/admin, /apps/agent, /apps/platform, /apps/playground]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    commit-message:
      prefix: "chore(images)"
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
