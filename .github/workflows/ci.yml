name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-smoke:
    name: Aule runner smoke test
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: aule-quality
    timeout-minutes: 3
    steps:
      - name: Verify the runner environment
        run: |
          test "$(id -u)" = 1001
          test ! -S /var/run/docker.sock
          git --version
          cmake --version
          python --version
          printf 'Executed on **%s** in an unprivileged container.\n' "$RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"

  contracts:
    name: Contracts and playground (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aule/playground typecheck
      - run: pnpm test
      # The contrast of what the playground really paints (computed colours, also disabled and
      # error states), in the Chrome of the runner.
      - run: pnpm --filter @aule/design contrast

  agent:
    name: Agent (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  platform:
    name: Platform (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/platform
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each test creates and drops its own database on this server.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/platform
      - run: cargo fmt --check
      - run: cargo test --locked

  engine:
    name: Engine (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo test --locked

  images:
    name: Images (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        app: [agent, playground, platform]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file apps/${{ matrix.app }}/Dockerfile --tag aule-${{ matrix.app }}:ci .

  required:
    name: Software CI
    needs: [contracts, agent, platform, engine, images]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test and image build to pass
        env:
          NODE_RESULT: ${{ needs.contracts.result }}
          PYTHON_RESULT: ${{ needs.agent.result }}
          RUST_RESULT: ${{ needs.platform.result }}
          ENGINE_RESULT: ${{ needs.engine.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
        run: |
          printf 'Node=%s Python=%s Rust=%s Engine=%s Images=%s\n' "$NODE_RESULT" "$PYTHON_RESULT" "$RUST_RESULT" "$ENGINE_RESULT" "$IMAGES_RESULT"
          test "$NODE_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$RUST_RESULT" = success
          test "$ENGINE_RESULT" = success
          test "$IMAGES_RESULT" = success
