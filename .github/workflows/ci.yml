name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-smoke:
    name: Aule runner smoke test
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: aule-quality
    timeout-minutes: 3
    steps:
      - name: Verify the runner environment
        run: |
          test "$(id -u)" = 1001
          test ! -S /var/run/docker.sock
          git --version
          cmake --version
          python --version
          printf 'Executed on **%s** in an unprivileged container.\n' "$RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"

  contracts:
    name: Contracts and playground (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aule/playground typecheck
      - run: pnpm test

  agent:
    name: Agent (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - name: Pedagogy evaluation budget (offline)
        run: uv run pytest evals/pedagogy/test_budget.py

  platform:
    name: Platform (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/platform
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each test creates and drops its own database on this server.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/platform
      - run: cargo fmt --check
      - run: cargo test --locked
      - name: Pedagogy arithmetic adapter (offline)
        working-directory: .
        run: cargo test --locked --manifest-path apps/agent/evals/pedagogy/checker/Cargo.toml
      - name: Restore a synthetic backup and reject invalid SQL
        working-directory: .
        run: bash infra/server/test-restore-check.sh

  engine:
    name: Engine (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
      - run: cargo test --locked

  images:
    name: Images (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        app: [agent, playground, platform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --file apps/${{ matrix.app }}/Dockerfile --build-arg AULE_COMMIT=${{ github.sha }} --tag aule-${{ matrix.app }}:ci .

  version:
    name: Version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every copy of the version and the changelog agree
        run: python3 scripts/version.py check
      - name: The version tool's tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  research:
    name: Student performance benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/student-performance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -r requirements.lock.txt
      - run: .venv/bin/python download_data.py
      - run: .venv/bin/python experiment.py
      - run: .venv/bin/python build_report.py
      - run: node verify.mjs

  required:
    name: Software CI
    needs: [contracts, agent, platform, engine, images, version, research]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test and image build to pass
        env:
          NODE_RESULT: ${{ needs.contracts.result }}
          PYTHON_RESULT: ${{ needs.agent.result }}
          RUST_RESULT: ${{ needs.platform.result }}
          ENGINE_RESULT: ${{ needs.engine.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          VERSION_RESULT: ${{ needs.version.result }}
          RESEARCH_RESULT: ${{ needs.research.result }}
        run: |
          printf 'Node=%s Python=%s Rust=%s Engine=%s Images=%s Version=%s\n' "$NODE_RESULT" "$PYTHON_RESULT" "$RUST_RESULT" "$ENGINE_RESULT" "$IMAGES_RESULT" "$VERSION_RESULT"
          test "$NODE_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$RUST_RESULT" = success
          test "$ENGINE_RESULT" = success
          test "$IMAGES_RESULT" = success
          test "$VERSION_RESULT" = success
          test "$RESEARCH_RESULT" = success
