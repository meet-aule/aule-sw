name: Code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Ruff
    # Public pull requests always run on GitHub's disposable machines.
    # Set this variable only after enforcing the runner group's workflow policy.
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AULE_QUALITY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
        working-directory: apps/agent
      - name: Ruff report
        run: |
          mkdir -p reports
          apps/agent/.venv/bin/ruff check apps/agent --output-format sarif > reports/ruff.sarif
      - name: Formatting
        if: ${{ !cancelled() }}
        run: apps/agent/.venv/bin/ruff format --check apps/agent
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ !cancelled() && github.event_name != 'pull_request' && hashFiles('reports/ruff.sarif') != '' }}
        with:
          sarif_file: reports/ruff.sarif
          category: ruff
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ruff-report
          path: reports/ruff.sarif
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Clippy and RustSec
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AULE_QUALITY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/platform
      - name: Report tools
        run: |
          cargo install --locked clippy-sarif --version 0.8.0
          cargo install --locked cargo-audit --version 0.23.0
      - name: Clippy report
        working-directory: apps/platform
        run: |
          mkdir -p ../../reports
          # Rust emits paths relative to its crate; GitHub needs repository paths.
          cargo clippy --all-targets --locked --message-format=json -- -D warnings \
            | clippy-sarif \
            | jq 'walk(if type == "object" and has("artifactLocation") then
                .artifactLocation.uri |= (if startswith("/") or startswith("file:") then . else "apps/platform/" + . end)
              else . end)' > ../../reports/clippy.sarif
      - name: Dependency audit
        if: ${{ !cancelled() }}
        working-directory: apps/platform
        run: |
          mkdir -p ../../reports
          # The audit exception is valid only while SQLite is not compiled.
          cargo tree --locked --target all --edges normal,build --prefix none > "$RUNNER_TEMP/dependency-tree.txt"
          if grep -q '^libsqlite3-sys ' "$RUNNER_TEMP/dependency-tree.txt"; then
            echo '::error::SQLite is now enabled; remove and reassess the RustSec exception.'
            exit 1
          fi
          cargo audit --file "$PWD/Cargo.lock" --format sarif > ../../reports/rustsec.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ !cancelled() && github.event_name != 'pull_request' && hashFiles('reports/*.sarif') != '' }}
        with:
          sarif_file: reports
          category: rust
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: rust-reports
          path: reports/*.sarif
          if-no-files-found: error
          retention-days: 14

  scripts:
    name: Workflows, shell scripts and Dockerfiles
    # The linters run from their images, and the Aule runner has no Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        # Its image carries ShellCheck, which also checks the workflows' run blocks.
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12
      - name: ShellCheck
        if: ${{ !cancelled() }}
        run: git ls-files -z '*.sh' | xargs -0 docker run --rm --volume "$PWD:/mnt" koalaman/shellcheck:v0.11.0 --severity=warning
      - name: Watch delivery regression tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s infra/watch -p 'test_*.py' -v
      - name: Offsite backup health tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s infra/server -p 'test_*.py' -v
      - name: Hadolint
        if: ${{ !cancelled() }}
        # Debian's package versions are not pinned: an old one leaves the archive and breaks the build.
        run: git ls-files -z '*Dockerfile' | xargs -0 docker run --rm --volume "$PWD:/mnt" --workdir /mnt hadolint/hadolint:v2.15.1 hadolint --failure-threshold warning --ignore DL3008
