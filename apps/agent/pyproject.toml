[project]
name = "aule-agent"
version = "0.0.1"  # x-aule-version
description = "Aule's voice tutor, a LiveKit Agents worker"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
dependencies = [
    "aiohttp>=3.10",
    "jsonschema[format]>=4.23",
    "livekit-agents[anthropic,assemblyai,cartesia,deepgram,elevenlabs,inworld,openai,silero]~=1.8.12",
    "posthog==8.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aule_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
