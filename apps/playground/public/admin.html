<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- The build this page comes from, written in by the server (src/build.ts). -->
    <meta name="aule-version" content="{{version}}" />
    <meta name="aule-commit" content="{{commit}}" />
    <title>Aule · Panel del equipo</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="admin">
      <header>
        <h1>Panel del equipo</h1>
        <p><a href="./">Volver a Aule</a></p>
        <!-- Which builds of this page and of the platform answer (admin.js). -->
        <p class="build" id="build" hidden></p>
      </header>

      <p id="message" class="message" role="alert" hidden></p>

      <section id="overview" hidden aria-labelledby="overview-title">
        <h2 id="overview-title">Últimos 14 días</h2>
        <div id="figures" class="figures"></div>
        <div class="scroll">
          <table>
            <thead>
              <tr><th>Día</th><th>Sesiones</th><th>Alumnos</th><th>Minutos</th><th>Costo (USD)</th><th>Costo por hora</th></tr>
            </thead>
            <tbody id="days"></tbody>
          </table>
        </div>
      </section>

      <section id="families-section" hidden aria-labelledby="families-title">
        <h2 id="families-title">Familias</h2>
        <input id="filter" type="search" placeholder="Buscar por nombre o correo" aria-label="Buscar familias" />
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>Familia</th><th>Correos</th><th>Alumnos</th><th>Plan</th><th>7 días</th><th>30 días</th>
                <th>Minutos (30 días)</th><th>Última sesión</th><th></th>
              </tr>
            </thead>
            <tbody id="families"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="admin.js"></script>
  </body>
</html>
