[package]
name = "aule-platform"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Aule's platform: families, children, consent, sessions, the learning model, memory and the supervisor"
repository = "https://github.com/meet-aule/aule-sw"
publish = false

[lib]
name = "aule_platform"
path = "src/lib.rs"

[[bin]]
name = "aule-platform"
path = "src/main.rs"

[dependencies]
# The session engine and its bank of exercises, from this repository.
aule-core = { path = "../../engine/crates/aule-core" }
contenido = { path = "../../engine/crates/contenido" }
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
base64 = "0.23"
hex = "0.4"
hmac = "0.13"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
semver = "1"
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json", "postgres-array", "postgres-vector"] }

[dev-dependencies]
# Only the schema check and the migration command diff the entities against a
# database; the server never changes its schema on its own.
sea-orm = { version = "2.0.4", default-features = false, features = ["schema-sync"] }
jsonschema = "0.61.2"
tower = { version = "0.5", features = ["util"] }
