<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- The build this page comes from, written in by the server (src/build.ts). -->
    <meta name="aule-version" content="{{version}}" />
    <meta name="aule-commit" content="{{commit}}" />
    <title>Aule · Panel del equipo · Entrar</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="admin signin">
      <header>
        <p class="wordmark"><img src="aule-logo.svg" alt="Aule" width="81" height="40" /></p>
        <h1>Panel del equipo</h1>
        <!-- Where a passkey can be used too, signin.js says so here. -->
        <p class="lead" id="lead">Entra con tu correo del equipo de Aule. Te enviamos un código.</p>
      </header>

      <!-- With a passkey: no address, the browser's own picker. Shown only where the browser can (signin.js). -->
      <div id="passkey-box" class="signin-passkey" hidden>
        <button type="button" id="passkey">Entrar con passkey</button>
        <p class="hint">¿Aún no tienes una passkey (llave de acceso)? Entra con tu correo y créala en «Passkeys».</p>
        <p class="or">O entra con un código por correo:</p>
      </div>

      <!-- Step one: the address. Every address gets the same answer (signin.js). -->
      <form id="email-form" class="signin-form" novalidate>
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required />
        <button type="submit" id="send">Enviar código</button>
      </form>

      <!-- Step two: the six digits from the mail. -->
      <form id="code-form" class="signin-form" hidden novalidate>
        <p class="message" id="sent" data-tone="info">Si es un correo del equipo, te enviamos un código. Vale 10 minutos.</p>
        <label for="code">Código</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required />
        <button type="submit" id="enter">Entrar</button>
        <button type="button" class="link" id="again">Usar otro correo</button>
      </form>

      <p id="message" class="message" role="alert" hidden></p>
    </main>
    <script type="module" src="signin.js"></script>
  </body>
</html>
